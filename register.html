<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — VELOUR</title>
<meta name="description" content="Create your VELOUR account." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="register">
<div id="site-header"></div>

<main>
  <section class="sec">
    <div class="wrap"><div class="auth-wrap">
      <div class="auth-card">
        <h1>Create account</h1>
        <p class="sub">Join for early access to new arrivals, private sales and stories from the atelier.</p>
        <form id="registerForm">
          <div class="field"><label for="rgName">Full name</label><input id="rgName" required placeholder="Your name"></div>
          <div class="field"><label for="rgEmail">Email address</label><input id="rgEmail" type="email" required placeholder="you@example.com"></div>
          <div class="field"><label for="rgPass">Password</label><input id="rgPass" type="password" required placeholder="Create a password"></div>
          <button class="btn block" type="submit">Create account</button>
        </form>
        <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div></div>
  </section>

</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
